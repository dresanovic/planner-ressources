# Grype currently treats fixes available only in newer CPython branches as
# actionable for Python 3.12. Keep these exceptions pinned to the exact runtime
# version so they expire automatically when the base image is upgraded.
# See: https://github.com/anchore/grype/issues/2852
show-suppressed: true

ignore:
  - vulnerability: CVE-2026-7210
    package:
      name: python
      version: 3.12.13
      type: binary

